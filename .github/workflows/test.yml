# Roda a suíte de testes no mesmo container usado localmente (ADR-001).
# Não publica nada: a publicação continua sendo o GitHub Pages servindo a raiz da main.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Constrói a imagem de desenvolvimento
        run: docker compose --profile dev build dev
      - name: Testes (unitários, paridade PT/EN, E2E)
        run: docker compose --profile dev run --rm -e CI=1 dev npm test
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ADR-006: os YAMLs de exemplo das lições são validados contra o schema da versão de referência.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extrai os YAMLs das lições
        run: |
          node tests/tools/extract-manifests.mjs build/manifests
          echo "K8S_VERSION=$(node tests/tools/extract-manifests.mjs --k8s-version)" >> "$GITHUB_ENV"
      - name: kubeconform (modo strict, schema da versão de referência)
        run: >-
          docker run --rm -v "$PWD/build/manifests:/m:ro" --entrypoint /kubeconform
          ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -kubernetes-version "$K8S_VERSION"
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          /m

  # Links externos e internos dos documentos (README, docs, guias).
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          args: >-
            --no-progress --exclude-loopback --max-retries 3
            --exclude 'linkedin\.com'
            './**/*.md'
