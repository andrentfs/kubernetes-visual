# Uso:
#   docker compose up            -> http://localhost:8080 (lê os arquivos da pasta: edite e recarregue)
#   docker compose up --build preview  -> http://localhost:8081 (imagem fechada, igual ao que vai publicado)
services:
  site:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  preview:
    build: .
    ports:
      - "8081:80"
    profiles: ["preview"]
