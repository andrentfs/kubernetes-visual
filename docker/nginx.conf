server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem cache: ao editar um arquivo, basta recarregar a página.
    add_header Cache-Control "no-store" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;   # site estático: arquivo inexistente devolve 404
    }
}
